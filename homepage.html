<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bacca SongBook — śpiewnik gitarowy z akordami">
  <title>Bacca SongBook</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #1a1a2e;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .logo {
      font-size: 3.5rem;
      font-style: italic;
      color: #f0d080;
      text-shadow: 0 2px 12px rgba(240,208,128,0.3);
      margin-bottom: 0.2em;
    }

    .tagline {
      font-size: 1.1rem;
      color: #aaa;
      letter-spacing: 0.08em;
      margin-bottom: 3rem;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      margin-bottom: 3rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 1rem;
      font-family: sans-serif;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }

    .btn-primary {
      background: #f0d080;
      color: #1a1a2e;
      font-weight: bold;
    }

    .btn-secondary {
      background: #2a2a4e;
      color: #e8e8f0;
      border: 1px solid #444;
    }

    .downloads {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 3rem;
    }

    .dl-btn {
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 0.9rem;
      background: #2a2a4e;
      color: #ccc;
      border: 1px solid #444;
      transition: background 0.15s;
    }
    .dl-btn:hover { background: #3a3a5e; color: #fff; }

    .footer {
      font-family: sans-serif;
      font-size: 0.8rem;
      color: #555;
      text-align: center;
    }
    .footer a { color: #777; text-decoration: none; }
    .footer a:hover { color: #aaa; }
  </style>
</head>
<body>

  <div class="logo">Bacca SongBook</div>
  <div class="tagline">Śpiewnik gitarowy z akordami</div>

  <div class="buttons">
    <a href="websongbook.html" class="btn btn-primary">
      🎸 Otwórz w przeglądarce
    </a>
  </div>

  <div class="downloads">
    <a href="https://github.com/sonnekern/bacca-songbook-releases/releases/latest" class="dl-btn">
      📱 Pobierz APK (Android)
    </a>
    <a href="https://github.com/sonnekern/bacca-songbook-releases/releases/latest" class="dl-btn">
      🖥️ Pobierz DEB (Linux)
    </a>
    <a href="https://github.com/sonnekern/bacca-songbook-releases/releases/latest" class="dl-btn">
      🪟 Pobierz EXE (Windows)
    </a>
  </div>

  <div class="footer">
    <a href="privacy.html">Polityka prywatności</a> &nbsp;·&nbsp;
    <a href="terms.html">Warunki użytkowania</a>
  </div>

</body>
</html>
